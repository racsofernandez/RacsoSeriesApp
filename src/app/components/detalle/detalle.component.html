<ion-header >
    <ion-toolbar>

        <!-- Aspa para volver -->
        <ion-buttons slot="start">
            <ion-button (click)="regresar()">
                <ion-icon slot="icon-only" name="close-outline"></ion-icon>
            </ion-button>
        </ion-buttons>

        <ion-title>
            {{ pelicula.title }}
        </ion-title>

        <!-- Favoritos -->
        <ion-buttons slot="end">
            <ion-button (click)="favorito()">
                <ion-icon
                        [name]="star"
                        [color]="star === 'star' ? 'warning' : 'medium'">
                </ion-icon>
            </ion-button>
        </ion-buttons>

    </ion-toolbar>
</ion-header>

<ion-content  [fullscreen]="true" class="detalle-content">

    <img
            [src]="pelicula.backdrop_path | imagen"
            class="backdrop"
            *ngIf="pelicula.backdrop_path">

    <ion-grid>
        <ion-row>
            <ion-col size="4" class="poster-detalle-sobre">
                <ion-card class="poster">
                    <img
                            [src]="pelicula.poster_path | imagen"
                            class="poster"
                            *ngIf="pelicula.poster_path">
                </ion-card>
            </ion-col>

            <ion-col>
                <ion-item>
                    <ion-icon slot="start" name="thumbs-up-outline"></ion-icon>
                    <ion-label>Rating</ion-label>
                    <ion-note slot="end" color="primary">
                        {{ pelicula.vote_average }}
                    </ion-note>
                </ion-item>

                <ion-item>
                    <ion-icon slot="start" name="people-outline"></ion-icon>
                    <ion-label>Votos</ion-label>
                    <ion-note slot="end" color="primary">
                        {{ pelicula.vote_count }}
                    </ion-note>
                </ion-item>
            </ion-col>
        </ion-row>
    </ion-grid>

    <ion-grid fixed>
        <ion-row>
            <ion-col>
                <h2 class="detalle-titulo">{{ pelicula.name }}</h2>
            </ion-col>
        </ion-row>

        <ion-row>
            <ion-col size="12">
                <ion-label>
                    {{ pelicula.overview | slice: 0: oculto }}...
                </ion-label>
                <ion-label
                        color="primary"
                        (click)="oculto = 5000"
                        *ngIf="oculto !== 5000">
                    Leer más
                </ion-label>
            </ion-col>
        </ion-row>

        <ion-row>
            <ion-col size="12">
                <ion-chip *ngFor="let genero of pelicula.genres" color="primary">
                    <ion-label>{{ genero.name }}</ion-label>
                </ion-chip>
            </ion-col>
        </ion-row>
    </ion-grid>

    <ion-grid fixed>
        <ion-row>
            <ion-col>
                <ion-label>Actores</ion-label>
            </ion-col>
        </ion-row>
    </ion-grid>

    <swiper-container [slidesPerView]="3.1" [freeMode]="true">
        <swiper-slide *ngFor="let actor of actores">
            <ion-card class="card-actor">
                <img [src]="actor.profile_path | imagen" *ngIf="actor.profile_path">
                <img src="/assets/no-avatar.jpg" *ngIf="!actor.profile_path">
                <ion-label>{{ actor.name }}</ion-label>
            </ion-card>
        </swiper-slide>
    </swiper-container>

</ion-content>
