<ion-header>
  <ion-toolbar>
    <ion-title>{{ seriesTitle }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="loading" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
  </div>

  <div *ngIf="!loading && reviews.length === 0" class="ion-text-center ion-padding">
    <p>{{ 'REVIEWS.EMPTY_MSG' | translate }}</p>
  </div>

  <ion-list lines="none" *ngIf="!loading && reviews.length > 0">
    <div *ngFor="let review of reviews" class="review-item">
      <div class="review-author">
        <strong>{{ review.user.alias }}</strong>
        <div class="review-rating">
          <ion-icon name="star" color="warning"></ion-icon> {{ review.rating }}
        </div>
      </div>
      <p class="review-comment">{{ review.comment }}</p>
    </div>
  </ion-list>
</ion-content>
