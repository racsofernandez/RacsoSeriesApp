<ion-header>
  <ion-toolbar>
    <ion-title>Temporadas - {{ seriesTitle }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card *ngFor="let season of seasonsList" class="season-card">
    <ion-item lines="none">
      <ion-thumbnail slot="start" class="season-poster">
        <img [src]="season.poster_path | imagen" *ngIf="season.poster_path">
        <img src="/assets/no-image-banner.jpg" *ngIf="!season.poster_path">
      </ion-thumbnail>
      <ion-label class="ion-text-wrap">
        <h2>{{ season.name }}</h2>
        <p>{{ season.episode_count }} episodios</p>
        <p *ngIf="season.air_date">Estreno: {{ season.air_date | date:'yyyy' }}</p>
      </ion-label>
    </ion-item>

    <ion-card-content *ngIf="season.overview">
      <p class="overview" [class.expanded]="season.expanded">{{ season.overview }}</p>

      <ion-button
          color="primary"
          fill="clear"
          class="overview-toggle"
          (click)="toggleOverview(season)"
          *ngIf="season.overview.length > 150">
        {{ season.expanded ? 'Ver menos' : 'Ver más' }}
      </ion-button>
    </ion-card-content>
  </ion-card>

</ion-content>
