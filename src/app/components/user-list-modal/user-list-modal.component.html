<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="close()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ isNew ? ('LISTS.NEW_LIST' | translate) : ('LISTS.EDIT_LIST' | translate) }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="saveList()" [disabled]="!name.trim() || loading">
        <ion-icon slot="icon-only" name="checkmark-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="main-content">

  <div class="form-section">
    <ion-item lines="none" class="custom-input">
      <ion-label position="stacked">{{ 'LISTS.NAME_LABEL' | translate }}</ion-label>
      <ion-input [(ngModel)]="name" placeholder="Ej: Series para ver en verano"></ion-input>
    </ion-item>

    <ion-item lines="none" class="custom-input">
      <ion-label position="stacked">{{ 'LISTS.DESC_LABEL' | translate }}</ion-label>
      <ion-textarea [(ngModel)]="description" rows="3" placeholder="Descripción opcional..."></ion-textarea>
    </ion-item>
  </div>

  <div class="series-section" *ngIf="!isNew">
    <div class="section-header">
      <h3>{{ 'LISTS.SERIES_IN_LIST' | translate }} ({{ series.length }})</h3>
      <ion-button fill="clear" color="danger" (click)="confirmDelete()">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-button>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="series.length === 0 && !loading">
      <ion-icon name="albums-outline"></ion-icon>
      <p>{{ 'LISTS.EMPTY_SERIES' | translate }}</p>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="ion-text-center ion-padding">
      <ion-spinner name="crescent"></ion-spinner>
    </div>

    <!-- Series List -->
    <ion-list lines="none" *ngIf="series.length > 0">
      <ion-item *ngFor="let serie of series" class="serie-item">
        <div class="poster-thumb" slot="start" (click)="verDetalle(serie.id)">
          <img [src]="(serie.poster_path || '') | imagen">
        </div>
        <ion-label>
          <h2>{{ serie.name }}</h2>
          <p class="overview">{{ serie.overview }}</p>
        </ion-label>

        <!-- Botón de eliminar visible -->
        <ion-button fill="clear" color="medium" slot="end" (click)="removeSeries(serie.id)">
          <ion-icon slot="icon-only" name="close-circle-outline"></ion-icon>
        </ion-button>
      </ion-item>
    </ion-list>
  </div>

</ion-content>
