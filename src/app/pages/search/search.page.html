<ion-header>
    <ion-toolbar>
        <ion-title>
            {{ 'TABS.SEARCH' | translate }}
        </ion-title>
        <ion-buttons slot="end">
            <ion-button (click)="abrirGeneros()">
                <ion-icon slot="start" name="list-outline"></ion-icon>
                {{ 'SEARCH.GENRES' | translate }}
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-toolbar>
    <ion-searchbar [placeholder]="'TABS.SEARCH' | translate" animated debounce="700" [value]="textoBuscar" (ionInput)="buscar($event)">

    </ion-searchbar>

</ion-toolbar>

<ion-content>
    <ion-grid *ngIf="buscando">
        <ion-row>
            <ion-col class="ion-text-center">
                <ion-spinner name="crescent"></ion-spinner>
            </ion-col>
        </ion-row>
    </ion-grid>

    <ion-list *ngIf="peliculas.length === 0 ">
        <ion-list-header>
            <ion-label>Ideas</ion-label>
        </ion-list-header>
        <ion-item *ngFor="let idea of ideas">
            <ion-label color="primary" (click)="seleccionarIdea(idea)">{{idea}}</ion-label>
        </ion-item>
    </ion-list>

    <ion-grid>
        <ion-row>
            <ion-col size="4" *ngFor="let pelicula of peliculas">
                <ion-card (click)="verDetalle( pelicula.id )">
                    <img [src]="pelicula.poster_path | imagen" *ngIf="pelicula.poster_path">
                    <img src="/src/assets/no-image-banner.jpg" *ngIf="!pelicula.poster_path">
                    <ion-card-header>
                        <ion-card-subtitle>{{pelicula.release_date}}</ion-card-subtitle>
                    </ion-card-header>
                    <ion-card-content>
                        <h2>{{pelicula.title}}</h2>
                    </ion-card-content>
                </ion-card>
            </ion-col>
        </ion-row>
    </ion-grid>


</ion-content>
