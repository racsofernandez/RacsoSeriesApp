<ion-header>
    <ion-toolbar>
        <ion-title>Favoritos</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content>

    <div *ngFor="let genero of favoritoGenero">
        <ion-grid *ngIf="genero.pelis.length > 0">
            <ion-row>
                <ion-col>
                    <h4>{{genero.name}}</h4>
                </ion-col>
            </ion-row>
            <app-slideshow-poster-fav
                    [peliculas]="genero.pelis"
                    (dismissEvent)="onModalDismiss($event)">
            </app-slideshow-poster-fav>

        </ion-grid>
    </div>

</ion-content>
