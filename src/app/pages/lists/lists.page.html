<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="page-title">{{ 'TABS.LISTS' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openListModal()">
        <ion-icon slot="icon-only" name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="main-content">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- Skeleton Loading -->
  <div *ngIf="loading">
    <ion-list lines="none">
      <ion-item *ngFor="let i of [1,2,3]" class="list-item">
        <ion-label>
          <h2><ion-skeleton-text animated style="width: 50%"></ion-skeleton-text></h2>
          <p><ion-skeleton-text animated style="width: 80%"></ion-skeleton-text></p>
        </ion-label>
      </ion-item>
    </ion-list>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!loading && lists.length === 0">
    <ion-icon name="list-outline"></ion-icon>
    <h3>{{ 'LISTS.EMPTY_TITLE' | translate }}</h3>
    <p>{{ 'LISTS.EMPTY_MSG' | translate }}</p>
    <ion-button fill="outline" (click)="openListModal()">
      {{ 'LISTS.CREATE_FIRST' | translate }}
    </ion-button>
  </div>

  <!-- Lists -->
  <ion-list lines="none" *ngIf="!loading && lists.length > 0">
    <ion-item *ngFor="let list of lists" button (click)="openListModal(list)" class="list-item">
      <ion-icon name="list-circle-outline" slot="start" color="primary"></ion-icon>
      <ion-label>
        <h2>{{ list.name }}</h2>
        <p>{{ list.description || ('LISTS.NO_DESC' | translate) }}</p>
      </ion-label>
      <ion-note slot="end">{{ list.series?.length || 0 }}</ion-note>
    </ion-item>
  </ion-list>

</ion-content>
