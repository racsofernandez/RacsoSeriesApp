<ion-content class="main-content">

    <div class="login-container">

        <div class="logo-section">
            <img src="assets/seriesapp-logo.png" alt="SeriesApp Logo" class="app-logo-img">
            <h1>SeriesApp</h1>
            <p>{{ 'AUTH.LOGIN' | translate }}</p>
        </div>

        <div class="form-section">
            <div class="input-group">
                <ion-item lines="none" class="custom-input">
                    <ion-icon name="mail-outline" slot="start"></ion-icon>
                    <ion-input [placeholder]="'AUTH.EMAIL' | translate" [(ngModel)]="email" type="email"></ion-input>
                </ion-item>

                <ion-item lines="none" class="custom-input">
                    <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
                    <ion-input [placeholder]="'AUTH.PASSWORD' | translate" [(ngModel)]="password" type="password"></ion-input>
                </ion-item>
            </div>

            <div class="forgot-pass">
                <ion-button fill="clear" size="small" (click)="goForgot()">
                    {{ 'AUTH.FORGOT_PASSWORD' | translate }}
                </ion-button>
            </div>

            <ion-button expand="block" class="main-btn" (click)="login()">
                {{ 'AUTH.LOGIN' | translate }}
            </ion-button>

            <div class="divider">
                <span>O</span>
            </div>

            <ion-button expand="block" class="google-btn" (click)="loginGoogle()">
                <ion-icon slot="start" name="logo-google"></ion-icon>
                {{ 'AUTH.SIGN_IN_WITH_GOOGLE' | translate }}
            </ion-button>
        </div>

        <div class="footer-section">
            <p>{{ 'AUTH.DONT_HAVE_ACCOUNT' | translate }}</p>
            <ion-button fill="clear" (click)="openRegisterModal()">
                {{ 'AUTH.REGISTER' | translate }}
            </ion-button>
        </div>

    </div>

</ion-content>
