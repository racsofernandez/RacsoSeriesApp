<ion-content *ngIf="loaded">

    <ion-grid>
        <ion-row>
            <ion-col>
                <h3>{{ 'HOME.UPCOMING' | translate }}</h3>
            </ion-col>
        </ion-row>
    </ion-grid>

    <app-slideshow-backdrop [peliculas]="recientes"></app-slideshow-backdrop>

    <ion-grid fixed>
        <ion-row>
            <ion-col>
                <h3>{{ 'HOME.NOW_PLAYING' | translate }}</h3>
            </ion-col>
        </ion-row>
    </ion-grid>

    <app-slideshow-poster [peliculas]="recientes"></app-slideshow-poster>

    <ion-grid fixed>
        <ion-row>
            <ion-col>
                <h3>{{ 'HOME.POPULAR' | translate }}</h3>
            </ion-col>
        </ion-row>
    </ion-grid>

    <app-slideshow-pares [peliculas]="populares" (cargarMas)="cargarMas()"></app-slideshow-pares>

</ion-content>
