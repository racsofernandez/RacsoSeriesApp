name: Deploy to Firebase DEV

on:
  push:
    branches:
      - develop
  workflow_dispatch:     # 👈 Añade esta línea para habilitar el botón manual

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    # 👇 Asociamos el entorno GitHub según la rama
    environment: 'dev'

    env:
      NG_APP_BACKEND_URL: ${{ secrets.BACKEND_URL }}
      NG_APP_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      NG_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      NG_APP_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      NG_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      NG_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      NG_APP_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 👈 Clona todo el historial (necesario para GitVersion)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Show calculated version
        run: echo "Version = ${{ steps.gitversion.outputs.SemVer }}"

      # 👇 Este paso genera environment.ts con la versión incluida
      - name: Generate environment file
        run: node scripts/set-env.cjs "${{ steps.gitversion.outputs.SemVer }}"

      - name: Build Angular app
        run: npm run build --configuration='development'

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@v13.15.3
        with:
          args: deploy --only hosting -P 'dev'