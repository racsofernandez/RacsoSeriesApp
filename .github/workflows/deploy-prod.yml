name: Deploy to Production

on:
  workflow_dispatch:  # ejecución manual

permissions:
  contents: read
  id-token: write

jobs:
  deploy_prod:
    runs-on: ubuntu-latest

    environment: 'prod'

    env:
      NG_APP_BACKEND_URL: ${{ vars.BACKEND_URL }}
      NG_APP_IMGPATH: ${{ vars.IMGPATH }}
      NG_APP_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      NG_APP_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      NG_APP_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🧠 Verificación de que se está desplegando una TAG
      - name: Check if current ref is a tag
        run: |
          echo "Current ref: $GITHUB_REF"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "❌ Error: This workflow must be triggered from a tag (e.g. v1.0.0)"
            exit 1
          fi
          echo "✅ Tag detected: ${GITHUB_REF#refs/tags/}"

      - name: Download latest release asset
        uses: robinraju/release-downloader@v1.10
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          fileName: "app-dist.zip"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unzip build
        run: unzip app-dist.zip -d ./www

      # ⚙️ Generamos el environment de producción
      - name: Generate environment file for PROD
        run: node scripts/set-env.cjs "${GITHUB_REF#refs/tags/}" "../www/assets"

      # --- Autenticación ---
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # --- Construcción de la imagen ---
      - name: Build Docker image
        run: |
          docker build -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/frontend:${{ steps.gitversion.outputs.SemVer }} .

      - name: Push Docker image
        run: |
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/frontend:${{ steps.gitversion.outputs.SemVer }}

      # --- Despliegue en Cloud Run ---
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.GCP_ARTIFACT_REPOSITORY }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/frontend:${{ steps.gitversion.outputs.SemVer }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated
