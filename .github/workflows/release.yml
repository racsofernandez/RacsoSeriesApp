name: Build and Release

on:
#  push:
#    branches:
#      - master
  workflow_dispatch: # Ejecución manual

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 👈 Clona todo el historial (necesario para GitVersion)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Show calculated version
        run: |
          echo "VERSION_NAME=${{ steps.gitversion.outputs.SemVer }}" >> $GITHUB_ENV
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build Angular app
        run: npm run build -- --configuration production

      - name: Package build artifact
        run: |
          cd www
          zip -r ../app-dist.zip .
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: app-dist.zip

      # --- Generar changelog automático ---
      - name: Generate changelog
        id: changelog
        run: |
          # Encuentra el último tag
          LAST_TAG=$(git describe --tags --abbrev=0 || echo "")
          echo "Last tag: $LAST_TAG"
          if [ -z "$LAST_TAG" ]; then
          # Si no hay tag, listamos todos los commits
          CHANGELOG=$(git log --pretty=format:"- %s (%h)")
          else
          CHANGELOG=$(git log $LAST_TAG..HEAD --pretty=format:"- %s (%h)")
          fi
          echo "$CHANGELOG" > changelog.txt
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat changelog.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # --- Instalar Java ---
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # --- Instalar Android SDK ---
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --- Add Capacitor ---
      - name: Capacitor add (Android)
        run: npx cap add android

      # --- Build APK RELEASE ---
      - name: Build APK release
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug \
            -PversionName=${{ env.VERSION_NAME }} \
            -PversionCode=${{ env.VERSION_CODE }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gitversion.outputs.SemVer }}
          name: "Release v${{ steps.gitversion.outputs.SemVer }}"
          body: |
            ## Changelog

            ${{ env.CHANGELOG }}

            Version Name: ${{ env.VERSION_NAME }}
            Version Code: ${{ env.VERSION_CODE }}
          files: |
            app-dist.zip
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
