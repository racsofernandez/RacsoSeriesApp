name: Build Application

on:
  workflow_dispatch:     # 👈 Añade esta línea para habilitar el botón manual
  push:
    branches-ignore:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 👈 Clona todo el historial (necesario para GitVersion)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '5.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Show calculated version
        run: echo "Version = ${{ steps.gitversion.outputs.SemVer }}"

      # 👇 Este paso genera environment.ts con la versión incluida
      - name: Generate environment file
        run: node scripts/set-env.cjs "${{ steps.gitversion.outputs.SemVer }}"

      - name: Build Angular app
        run: npm run build
